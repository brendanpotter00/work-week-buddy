name = "wwb-sync"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# The workers.dev subdomain is ALWAYS on, and it is never traded away. Setup can
# additionally put the Worker on a domain you own, and then both addresses reach
# the same script and the same D1 — a Mac uses whichever one it can reach, which
# is the whole point on a network that filters workers.dev. Stated rather than
# left to the default, because "the deploy succeeded and there is no URL" is a
# confusing half-hour.
#
# A custom domain is NOT configured here. It is attached over the REST API by
# the in-app wizard, per account, and naming a live hostname in a tracked file
# in a public repo is a habit worth not starting.
workers_dev = true

# ── DO NOT DEPLOY THIS FILE DIRECTLY. ───────────────────────────────────────
# It is a template. `scripts/bringup-cloud.sh` copies it to
# worker/wrangler.generated.toml with the real database_id substituted in, and
# every wrangler command it runs passes `--config` pointing at that copy. The
# generated file is gitignored: this repo is public, and a tracked file that
# names live account resources is a habit worth not starting.
[[d1_databases]]
binding = "DB"
database_name = "wwb"
database_id = "REPLACE_AFTER_wrangler_d1_create"

# ── THIS WORKER READS NO SECRETS AND NO ENVIRONMENT VARIABLES. ──────────────
# Its only binding is DB, above. Per-machine bearer tokens used to be
# `secret_text` bindings; they are now rows in `machine_token` inside the
# database itself, holding a SHA-256 and never a token. See worker/schema.sql
# and worker/src/auth.ts.
#
# Consequences worth stating, because both used to be footguns:
#   • An upload can no longer silently delete another Mac's credential. There is
#     no binding to inherit and nothing for `?bindings_inherit=strict` to save.
#   • Revoking a Mac is one UPDATE against D1, not a `wrangler secret put`, and
#     it takes effect on that Mac's next request.
