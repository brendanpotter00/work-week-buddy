name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, even before the app exists. The repo is public, and AGENTS.md
  # promises the build fails if a credential is ever committed. This is that promise.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential-shaped strings
        run: |
          set -uo pipefail
          # Cloudflare API tokens, GitHub tokens, AWS keys, private keys, bearer literals.
          PATTERN='(gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|CLOUDFLARE_API_TOKEN[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_-]{20,})'
          if git ls-files -z | xargs -0 grep -nEI "$PATTERN" 2>/dev/null | grep -v '^\.github/workflows/ci\.yml:'; then
            echo "::error::A credential-shaped string is present in a tracked file."
            exit 1
          fi
          echo "Clean."

  test:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there an app yet?
        id: app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet — spec-only repo. Nothing to build."; fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.app.outputs.exists == 'true'
        run: npm run typecheck --if-present

      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: npm run test --if-present

  # The interval logic is a pure reducer and runs anywhere, which is the point of
  # keeping src/core/ free of electron. Anything touching koffi or Electron needs a
  # real Mac, so it lands here once those modules exist.
  #
  # This job also runs the LAUNCHED-APP SMOKE TEST, which is the only thing in
  # CI that opens a window and looks at it. The dashboard once shipped crammed
  # into the 560 x 640 onboarding window past a fully green suite, because every
  # renderer test mounts a component in a jsdom that has no window, no size and
  # no URL. See src/main/smoke.ts.
  macos:
    name: macOS build + launched-app smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is there an app yet?
        id: app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Spec-only repo. Nothing to build."; fi
      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.app.outputs.exists == 'true'
        run: npm ci
      - name: Native + build
        if: steps.app.outputs.exists == 'true'
        run: |
          npm run test:native --if-present
          npm run build --if-present

      # Launches the built app, opens BOTH windows for real, and measures them.
      # It fails if a window renders the wrong view, if either window's content
      # is wider than its viewport, if the fixed 560 x 640 onboarding box cannot
      # hold its own contents, or if a permission grant does not reach an open
      # window. WWB_FAKE_NATIVE=1 substitutes the fake SignalSource, which needs
      # no TCC grant and which a packaged build refuses on purpose
      # (src/native/index.ts) — so this runs unattended and the real thing is
      # still checked by `npm run selftest` against the installed bundle.
      - name: Launched-app smoke
        if: steps.app.outputs.exists == 'true'
        env:
          WWB_FAKE_NATIVE: "1"
          WWB_SMOKE_DIR: ${{ runner.temp }}/smoke
        run: npm run smoke --if-present

      # ── THE SAME RUN, AGAINST THE THING WE ACTUALLY SHIP ──────────────────
      # The step above runs `electron .` from a shell. That is not the app.
      # A packaged build launched by LaunchServices is a different process with
      # a different TCC identity, and the difference cost a release: the app
      # booted, showed its tray icon, opened its database and then had NO
      # WINDOWS AT ALL with nothing on stderr, because its main thread was
      # blocked on a macOS consent prompt a terminal launch never sees.
      # src/main/file-access.ts has the whole story.
      #
      # This packages the real .app, launches it through `open -n` — what Finder
      # and the LaunchAgent use — and waits for a verdict file. No verdict
      # inside the timeout is the failure that matters.
      - name: Packaged smoke (real .app, launched by LaunchServices)
        if: steps.app.outputs.exists == 'true'
        env:
          WWB_SMOKE_DIR: ${{ runner.temp }}/smoke-packaged
        run: bash tools/smoke-packaged.sh

      # A gate nobody has watched fail is a gate nobody should trust — and this
      # one was wrong once. Its trap used to sit where weeklyBackup() writes,
      # which is AFTER boot, so it proved only that a post-boot freeze is
      # visible: it passed green while a boot-path freeze was shipping.
      #
      # Both traps now, and the boot one first, because that is where both real
      # failures were. Each blocks the packaged app's main thread in an open(2)
      # that never returns — inside the run's own throwaway profile — and passes
      # only if the step above would have caught it.
      - name: Prove the gate sees a freeze ON THE BOOT PATH
        if: steps.app.outputs.exists == 'true'
        env:
          WWB_SMOKE_DIR: ${{ runner.temp }}/smoke-proveit-boot
        run: bash tools/smoke-packaged.sh --no-build --prove-it=boot

      - name: Prove the gate sees a freeze after the windows are up
        if: steps.app.outputs.exists == 'true'
        env:
          WWB_SMOKE_DIR: ${{ runner.temp }}/smoke-proveit-sync
        run: bash tools/smoke-packaged.sh --no-build --prove-it=sync

      # The screenshots are the point when it fails: "why is it squished" is a
      # question a number answers badly and a picture answers immediately. The
      # packaged run's boot log ships too — when a boot freezes, the log ending
      # one step early IS the diagnosis.
      - name: Upload smoke screenshots and logs
        if: always() && steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/smoke-packaged
            ${{ runner.temp }}/smoke-proveit-boot
            ${{ runner.temp }}/smoke-proveit-sync
          if-no-files-found: ignore
